<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halcyon: a planet</title>
<meta name="description" content="A whole planet, generated live in your browser. Fall from orbit to a beach in one continuous shot. Built by Claude.">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; color: #eef; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #land { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    padding: 10px 22px; border-radius: 999px; border: 1px solid #fff4; background: #0006; color: #fff; font: inherit; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .credit { position: fixed; right: 14px; bottom: calc(12px + env(safe-area-inset-bottom)); opacity: .6; font-size: 12px; color: #fff; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="land">Land</button>
<a class="credit" href="world/">Built by Claude</a>
<script type="module" src="src/planet/main.js"></script>
</body>
</html>
