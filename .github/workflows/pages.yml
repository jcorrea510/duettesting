name: Publish to GitHub Pages

# GitHub Pages serves this repo from the gh-pages branch.
# Every push to main copies the site files there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir -p _site
          cp index.html _site/
          for f in og.png og.jpg; do [ -f "$f" ] && cp "$f" _site/ || true; done
          [ -d docs ] && cp -r docs _site/ || true
          touch _site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
